name: Opt-in Azure smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Accelerator HTTPS URL ending in /openai/v1/
        required: true
      app_id:
        description: Accelerator API app/client ID
        required: true
      kind:
        type: choice
        options: [chat, responses]
        default: chat
      create_job:
        type: boolean
        description: I understand this creates a billable batch job
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  azure-smoke:
    if: inputs.create_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.6.5
      - run: uv sync --locked --all-extras
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create one smoke batch
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_ID: ${{ inputs.app_id }}
          KIND: ${{ inputs.kind }}
        run: uv run --locked --all-extras python scripts/smoke_test.py --base-url "$BASE_URL" --app-id "$APP_ID" --kind "$KIND" --create-job
