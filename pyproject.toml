[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "azure-ptu-batch-accelerator"
version = "0.1.0"
description = "OpenAI Files/Batch-compatible asynchronous inference on existing Azure OpenAI PTUs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.20,<2", "azure-cosmos>=4.9,<5", "aiohttp>=3.11,<4",
  "azure-storage-blob>=12.25,<13", "azure-servicebus>=7.14,<8",
  "azure-functions>=1.21,<2", "azure-monitor-opentelemetry>=1.6,<2",
]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "openai>=2,<4", "ruff>=0.11,<1", "respx>=0.22,<1", "build>=1.2,<2"]

[project.scripts]
ptu-batch = "ptu_batch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ptu_batch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["azure: opt-in real Azure end-to-end test", "large: large-payload integration tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
